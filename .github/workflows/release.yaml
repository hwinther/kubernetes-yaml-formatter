name: Release to Visual Studio Code Extension Marketplace and Open VSX

# Marketplace pre-release convention (per VS Code docs):
#   even minor = stable     (0.2.x, 0.4.x, 1.0.x, ...)
#   odd  minor = pre-release (0.3.x, 0.5.x, 1.1.x, ...)
# Versions are plain major.minor.patch — semver pre-release suffixes like -rc1 are NOT supported.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Marketplace and Open VSX
    runs-on: ubuntu-latest
    environment: publish
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Verify package.json version matches tag
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION). Bump package.json before tagging."
            exit 1
          fi

      - name: Determine release channel
        id: channel
        env:
          TAG: ${{ github.ref_name }}
        run: |
          MINOR=$(echo "$TAG" | cut -d. -f2)
          if [ $((MINOR % 2)) -eq 1 ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Detected odd minor ($MINOR) → publishing as pre-release"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Detected even minor ($MINOR) → publishing as stable"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Package extension (pre-release)
        if: steps.channel.outputs.prerelease == 'true'
        run: npx vsce package --pre-release --out extension.vsix

      - name: Package extension (stable)
        if: steps.channel.outputs.prerelease == 'false'
        run: npx vsce package --out extension.vsix

      - name: Publish to Marketplace (pre-release)
        if: steps.channel.outputs.prerelease == 'true'
        run: npx vsce publish --pre-release --packagePath extension.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Marketplace (stable)
        if: steps.channel.outputs.prerelease == 'false'
        run: npx vsce publish --packagePath extension.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX (pre-release)
        if: steps.channel.outputs.prerelease == 'true'
        run: npx ovsx publish --pre-release extension.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Publish to Open VSX (stable)
        if: steps.channel.outputs.prerelease == 'false'
        run: npx ovsx publish extension.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  # The GitHub release, with notes generated from the merged PRs and grouped by their type label
  # (.github/release.yml, synced from wshno/devops). Skipped when a release for the tag was already
  # created by hand.
  github-release:
    name: GitHub release
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it as it is."
            exit 0
          fi
          args=(--verify-tag --generate-notes --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
