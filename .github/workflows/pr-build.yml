name: PR build

# Lint, build and the vitest suite via the reusable pr-build workflow. On pushes to main it also runs
# (every enabled stack builds regardless of changes) and publishes the quality artifact, whose
# quality-summary workflow artifact feeds the wshno/devops repository report.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly too, so the quality-summary artifact (90 days) never expires between pushes.
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

concurrency:
  group: pr-build-caller-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pr-build:
    permissions:
      contents: read
      packages: read
      pull-requests: write
      checks: write
    uses: hwinther/reusable-workflows/.github/workflows/pr-build.yml@5ba6e5a72dec8dcd121cc864279889bb2fa6ed73 # v2.31.0
    with:
      node_enabled: true
      node_version: '24.x'
      node_working_directory: '.'
      node_changes_regex: '.*'
      npm_registry_url: 'https://registry.npmjs.org'
      node_test_enabled: true
      # After typecheck, build, lint and the vitest unit tests: Prettier, package the extension the way the
      # release does (vsce fails when @types/vscode is newer than engines.vscode, or the manifest is
      # broken), then the integration tests in a real VS Code (xvfb gives it a display).
      node_extra_command: npm run format:check && npx vsce package --out "$RUNNER_TEMP/extension.vsix" && xvfb-run -a npm test

  # Test results, coverage and warnings from this run as ghcr.io/hwinther/kubernetes-yaml-formatter/quality:main,
  # and as the workflow artifact quality-summary. Also runs when the build failed, so failures are reported.
  quality:
    needs: [pr-build]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: hwinther/reusable-workflows/.github/workflows/quality-artifact.yml@5ba6e5a72dec8dcd121cc864279889bb2fa6ed73 # v2.31.0
    with:
      tags: |
        main
